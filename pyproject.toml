[project]
name = "yale-scanning-qc"
version = "0.1.0"
description = "Image Quality Control System for Yale Scanning with YOLO26"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.4.0",
    "flask>=3.0.0",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "pillow>=10.2.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "albumentations>=1.4.0",
    "scikit-image>=0.22.0",
    "scipy>=1.12.0",
    "pyyaml>=6.0.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "huggingface-hub>=0.20.0",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
yale-qc = "src.cli:main"
download-images = "src.downloader:main"
augment-data = "src.augmentation.pipeline:main"
train-models = "src.training.train:main"
run-app = "src.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.hatch.build.targets.wheel]
packages = ["src"]

